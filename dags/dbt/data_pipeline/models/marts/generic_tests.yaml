models:
  - name: fct_orders
    columns:
      - name: order_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_orders')
                field: order_key
              config:
                severity: warn

      - name: status_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['P', 'O', 'F']